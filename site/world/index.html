<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Corva, Living</title>
<style>
  :root { --ink: #f6ead2; --muted: rgba(246, 234, 210, .7); --glass: rgba(30, 22, 14, .42); --line: rgba(246, 234, 210, .22); }
  html, body { margin: 0; height: 100%; background: #120d09; overflow: hidden; }
  body { font: 13px/1.3 Georgia, "Times New Roman", serif; color: var(--ink); }
  #view { display: block; position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom));
         display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 99px;
         background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
         max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center; }
  .bar button, .bar select { font: inherit; color: var(--ink); background: none; border: 0; padding: 7px 11px; border-radius: 99px; cursor: pointer; }
  @media (max-width: 520px) { .bar { gap: 0; padding: 4px; } .bar button, .bar select { padding: 7px 8px; } #clock { display: none; } }
  .bar button[aria-pressed="true"] { background: rgba(246, 234, 210, .18); }
  .bar select option { color: #222; }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 8px; letter-spacing: .08em; }
  .title { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 18px; letter-spacing: .32em; text-transform: uppercase;
           font-size: 12px; color: var(--muted); text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .title a { color: inherit; text-decoration: none; }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 12px;
          background: var(--glass); border: 1px solid var(--line); color: var(--ink); pointer-events: none; text-align: center;
          transition: opacity .8s; max-width: calc(100vw - 48px); }
  #hint.gone { opacity: 0; }
  #home { font-style: italic; }
  .labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .place { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; font: italic 13px Georgia, serif;
           color: var(--ink); background: none; border: 0; padding: 4px 6px; letter-spacing: .06em;
           text-shadow: 0 1px 3px rgba(0,0,0,.65), 0 0 10px rgba(0,0,0,.35); white-space: nowrap; }
  .place::after { content: ""; display: block; width: 1px; height: 10px; margin: 2px auto 0; background: var(--muted); }
  .place.city { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; font-style: normal; }
  .place.mountain { color: var(--muted); }
  #fps { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 16px; font: 12px ui-monospace, monospace;
         color: var(--ink); background: var(--glass); padding: 4px 8px; border-radius: 8px; z-index: 10; }
  /* sandbox mode (?world=sandbox): estate and event labels, the person panel */
  .sb-label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; font: italic 12px Georgia, serif;
              color: var(--ink); background: rgba(30, 22, 14, .5); border: 1px solid var(--line); border-radius: 8px;
              padding: 3px 8px; white-space: nowrap; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .sb-label small { display: block; font-size: 10px; color: var(--muted); letter-spacing: .06em; }
  .sb-label i, #sbPanel .who i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .sb-label.event { background: rgba(80, 30, 14, .55); font-style: normal; }
  #sbPanel { position: fixed; top: max(48px, calc(env(safe-area-inset-top) + 40px)); right: 14px; width: min(420px, calc(100vw - 28px));
             max-height: calc(100vh - 150px); overflow-y: auto; z-index: 20; padding: 14px 16px; border-radius: 14px;
             background: rgba(24, 18, 12, .86); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
             font: 14px/1.5 Georgia, serif; }
  #sbPanel[hidden] { display: none; }
  #sbPanel .close { position: absolute; top: 6px; right: 8px; font: 22px Georgia, serif; color: var(--muted); background: none; border: 0; cursor: pointer; }
  #sbPanel .who { font-size: 18px; margin: 0 24px 2px 0; }
  #sbPanel .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0; }
  #sbPanel h4 { font: 600 11px/1 Georgia, serif; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  #sbPanel h4 small { letter-spacing: 0; text-transform: none; font-weight: 400; }
  #sbPanel .dream { font-style: italic; margin: 4px 0; }
  #sbPanel .belief { margin: 4px 0; } #sbPanel .belief span { display: inline-block; min-width: 38px; color: #e8b34a; font-size: 12px; }
  .title a { pointer-events: auto; }
  /* the full character panel (site/js/sandbox-data.js personHtml) */
  #sbPanel a { color: #e8b34a; text-decoration: none; }
  #sbPanel .person-head { display: flex; gap: 12px; align-items: flex-start; margin-right: 18px; }
  #sbPanel .portrait { border-radius: 8px; flex: none; object-fit: cover; }
  #sbPanel .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  #sbPanel ul.links { margin: 0; padding-left: 16px; font-size: 13.5px; } #sbPanel ul.links small { color: var(--muted); }
  #sbPanel .dreams { display: grid; gap: 8px; }
  #sbPanel .dream-card { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #sbPanel .dream-card img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  #sbPanel .dream-card figcaption { padding: 6px 9px; font-style: italic; font-size: 13px; }
  #sbPanel .dream-card small { display: block; font-style: normal; color: var(--muted); font-size: 11px; }
  @media (max-width: 520px) { #sbPanel { top: auto; bottom: 70px; max-height: 62vh; } }
  noscript, .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="view" aria-label="Corva at the edge of the sea, a living painting"></canvas>
<div class="title"><a href="/">Arcadia</a> · Corva</div>
<div class="bar" role="toolbar" aria-label="Time of day, home and quality">
  <span id="clock">--:--</span>
  <button data-time="dawn" aria-pressed="false">Dawn</button>
  <button data-time="golden" aria-pressed="false">Golden hour</button>
  <button data-time="night" aria-pressed="false">Night</button>
  <button data-time="live" aria-pressed="true">Live</button>
  <button id="home" title="Fly back to the city">Corva</button>
  <select id="quality" aria-label="Quality">
    <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
  </select>
</div>
<div id="hint">Drag to move · pinch or scroll to zoom · twist or right-drag to turn · tap a place to fly there</div>
<noscript>Corva needs JavaScript and WebGL.</noscript>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
