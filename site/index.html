<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcadia</title>
  <style>
    :root { --bg: #f4efe6; --ink: #2b2620; --muted: #7a6f60; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16140f; --ink: #e8e0d0; --muted: #9a8f7d; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
           font-family: Georgia, "Times New Roman", serif; }
    main { max-width: 34rem; }
    h1 { font-weight: normal; letter-spacing: 0.3em; text-transform: uppercase; font-size: 1.1rem; color: var(--muted); }
    p { font-size: 1.25rem; line-height: 1.6; }
    .soon { font-size: 0.95rem; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <main>
    <h1>Arcadia</h1>
    <p>In Poussin's painting, shepherds find an inscription they can't agree on.
       Arcadia is a world built the same way: it records what happens, never what it means.</p>
    <p class="soon">The first dreams are still being trained.</p>
  </main>
</body>
</html>
