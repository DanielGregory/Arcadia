<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Arcadia Review</title>
<style>
  :root {
    --bg: #f5f0e6; --card: #fffdf8; --ink: #2a2620; --muted: #776d5f; --line: #e3d9c6;
    --gold: #b8862b; --gold-soft: #f3e3bd; --keep: #3f7d4f; --keep-soft: #dcefe0;
    --skip: #9a4a3c; --skip-soft: #f5ddd7; --shadow: 0 1px 2px rgba(60,45,20,.08), 0 4px 14px rgba(60,45,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15130f; --card: #1f1c17; --ink: #ece4d4; --muted: #a59a88; --line: #343028;
      --gold: #d9a94a; --gold-soft: #3a2f18; --keep: #7cc28d; --keep-soft: #1f3324;
      --skip: #e08a78; --skip-soft: #3b231e; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding-bottom: env(safe-area-inset-bottom); -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 12px 16px 0;
           padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
  h1 { font: 600 13px/1 Georgia, serif; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin: 4px 0 12px; }
  nav { display: flex; gap: 4px; }
  nav button { flex: 1; font: inherit; font-size: 15px; padding: 10px 0 12px; background: none; border: 0;
               border-bottom: 2px solid transparent; color: var(--muted); }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  section[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
          margin-bottom: 16px; box-shadow: var(--shadow); }
  .card.picked { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
  .card img { display: block; width: 100%; height: auto; background: var(--line); aspect-ratio: 1344 / 768; object-fit: cover; }
  .card .wall { aspect-ratio: 16 / 9; }
  .body { padding: 12px 14px 14px; }
  .meta { font-size: 13px; color: var(--muted); }
  .prompt { font: italic 15px/1.45 Georgia, serif; color: var(--muted); margin: 6px 0 0; }
  .text { font: 17px/1.6 Georgia, serif; margin: 8px 0 0; white-space: pre-line; }
  .text.clamped { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .more { font: inherit; font-size: 14px; color: var(--gold); background: none; border: 0; padding: 6px 0 0; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; font: inherit; font-size: 15px; font-weight: 600; padding: 11px 0; border-radius: 10px;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 44px; }
  .btn.keep.on { background: var(--keep-soft); border-color: var(--keep); color: var(--keep); }
  .btn.skip.on { background: var(--skip-soft); border-color: var(--skip); color: var(--skip); }
  .btn.pick.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  textarea { width: 100%; margin-top: 10px; font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; min-height: 42px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
           background: var(--gold-soft); color: var(--gold); margin-left: 6px; }
  .tally { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .tally strong { font: 600 22px Georgia, serif; }
  .filters { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
  .chip { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line);
          background: var(--card); color: var(--muted); white-space: nowrap; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .empty { color: var(--muted); text-align: center; padding: 40px 16px; font-style: italic; }
  .saved { font-size: 12px; color: var(--muted); height: 16px; margin-top: 4px; }
  #viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: flex;
            align-items: center; justify-content: center; }
  #viewer[hidden] { display: none; }
  #viewer img { max-width: 100%; max-height: 100%; }
  #toast { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 60;
           background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  #toast[hidden] { display: none; }
  #alert { margin: 12px 16px 0; padding: 12px 14px; border-radius: 10px; font-size: 15px;
           background: var(--skip-soft); color: var(--skip); border: 1px solid var(--skip); }
  #alert[hidden] { display: none; }
  #alert strong { display: block; margin-bottom: 2px; }
  /* Sky: always a night sky, whatever the page theme */
  .sky-wrap { position: relative; border-radius: 14px; overflow: hidden; background: #070a18; box-shadow: var(--shadow); }
  #skyCanvas { display: block; width: 100%; aspect-ratio: 1 / 1.05; touch-action: manipulation; cursor: pointer; }
  .sky-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 2px 4px; font-size: 13px; color: var(--muted); }
  .sky-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .star-card { margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips span { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); }
  .similar { margin-top: 12px; }
  .similar button { display: block; width: 100%; text-align: left; font: 14px/1.4 Georgia, serif; color: var(--ink);
                    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-top: 6px; }
  .similar small { color: var(--muted); font-family: -apple-system, sans-serif; }
  .today-head { font: 600 12px/1 Georgia, serif; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); margin: 4px 0 10px; }
  .downloads { display: flex; gap: 8px; margin-top: 12px; }
  .downloads a { flex: 1; text-align: center; text-decoration: none; font-size: 15px; font-weight: 600; padding: 11px 0;
                 border-radius: 10px; border: 1px solid var(--gold); color: var(--gold); background: var(--gold-soft); }
  .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 0; }
  .raw { font: italic 15px/1.55 Georgia, serif; color: var(--muted); margin: 4px 0 0; }
  .past { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .past .card { margin: 0; }
  .past .body { padding: 8px 10px 10px; }
  /* Chronicle (the world engine's sandbox) */
  .sandbox-note { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .sandbox-note a { color: var(--gold); }
  .chron { font: 16px/1.65 Georgia, serif; }
  .chron h1, .chron h2, .chron h3 { font-family: Georgia, serif; line-height: 1.25; }
  .chron h1 { font-size: 22px; margin: 4px 0 10px; } .chron h2 { font-size: 18px; margin: 22px 0 8px; } .chron h3 { font-size: 16px; margin: 18px 0 6px; }
  .chron blockquote { margin: 8px 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--gold-soft); color: var(--muted); }
  .chron ul { padding-left: 20px; }
  .chron.clamped { max-height: 520px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.grid { border-collapse: collapse; font-size: 13px; width: 100%; }
  table.grid th, table.grid td { padding: 6px 7px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  table.grid th:first-child, table.grid td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
  table.grid thead th { font-weight: 600; color: var(--muted); font-size: 11.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .cellnum { display: inline-block; min-width: 26px; padding: 2px 5px; border-radius: 6px; }
  .feel { display: inline-block; width: 30px; height: 22px; line-height: 22px; border-radius: 4px; font-size: 11px; color: #fff; }
  .bar-mini { display: inline-block; width: 70px; height: 7px; border-radius: 99px; background: var(--line); vertical-align: 1px; overflow: hidden; }
  .bar-mini b { display: block; height: 100%; background: var(--keep); }
  details.who-believes { margin-top: 8px; font-size: 14px; }
  details.who-believes summary { cursor: pointer; color: var(--gold); }
  details.who-believes p { margin: 4px 0; } details.who-believes p small { color: var(--muted); }
  .sky-mode { display: flex; gap: 6px; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <h1>Arcadia · review <a href="/world/" style="float:right;letter-spacing:.15em;color:var(--gold);text-decoration:none">World ↗</a></h1>
  <nav role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="sky" aria-selected="false">Sky</button>
    <button role="tab" data-tab="corva" aria-selected="false">Corva</button>
    <button role="tab" data-tab="dreams" aria-selected="false">Dreams</button>
    <button role="tab" data-tab="wallpapers" aria-selected="false">Wallpapers</button>
    <button role="tab" data-tab="chronicle" aria-selected="false">Chronicle</button>
  </nav>
</header>

<div id="alert" role="alert" hidden></div>
<main>
  <section id="today"><p class="empty">Loading…</p></section>
  <section id="sky" hidden><p class="empty">Loading…</p></section>
  <section id="corva" hidden><p class="empty">Loading…</p></section>
  <section id="dreams" hidden><p class="empty">Loading…</p></section>
  <section id="wallpapers" hidden><p class="empty">Loading…</p></section>
  <section id="chronicle" hidden><p class="empty">Loading…</p></section>
</main>

<div id="viewer" hidden><img alt=""></div>
<div id="toast" hidden></div>

<script>
// Review tool only. Talks to Supabase with the PUBLISHABLE key, which is meant
// to be public: the database lets this key read everything and change only
// dreams.mark, dreams.note and images.picked (see the review_gallery migration).
const SUPABASE_URL = "https://dbrtvwhslxkdpmuawrgd.supabase.co";
const SUPABASE_KEY = "sb_publishable_NVNYh69hEq2uJKfWOvlAkg_9RCInRey";
const STORAGE = `${SUPABASE_URL}/storage/v1/object/public/arcadia/`;

const state = { images: [], dreams: [], mornings: [], filter: "all", run: null, day: null };

// Every row of a query: Supabase returns at most 1000 rows per request, so page through.
async function apiAll(path) {
  const rows = [];
  for (let offset = 0; ; offset += 1000) {
    const page = await api(`${path}&limit=1000&offset=${offset}`, { headers: { Prefer: "" } });
    rows.push(...page);
    if (page.length < 1000) return rows;
  }
}

async function api(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=minimal", ...(options.headers || {}) },
  });
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.status === 204 ? null : res.json();
}

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message; el.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (el.hidden = true), 3500);
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const imgUrl = path => STORAGE + path.split("/").map(encodeURIComponent).join("/");

function openViewer(src) { const v = document.getElementById("viewer"); v.querySelector("img").src = src; v.hidden = false; }
document.getElementById("viewer").addEventListener("click", e => (e.currentTarget.hidden = true));

// ---------------------------------------------------------------- tabs
document.querySelectorAll("nav button").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b === btn));
  document.querySelectorAll("main section").forEach(s => (s.hidden = s.id !== btn.dataset.tab));
  try { localStorage.setItem("arcadia-tab", btn.dataset.tab); } catch (_) {}
  window.scrollTo(0, 0);
  if (btn.dataset.tab === "sky" && skyDreams().length) requestAnimationFrame(drawSky);
}));
try { const t = location.hash.slice(1) || localStorage.getItem("arcadia-tab"); if (t) document.querySelector(`nav [data-tab="${t}"]`)?.click(); } catch (_) {}

// ---------------------------------------------------------------- Today
// One morning wallpaper a day (daily/morning.py). The newest is shown large;
// tapping an earlier one below brings it up top.
const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });

function renderToday() {
  const el = document.getElementById("today");
  if (!state.mornings.length) { el.innerHTML = `<p class="empty">No mornings yet. The first arrives after the morning run.</p>`; return; }
  const m = state.mornings.find(x => x.day === state.day) || state.mornings[0];
  const meta = m.meta || {};
  el.innerHTML = `
    <p class="today-head">${esc(meta.label || "Dream " + (meta.number ?? ""))} <span style="letter-spacing:.1em;text-transform:none">· ${esc(fmtDay(m.day))}</span></p>
    <article class="card">
      <img src="${imgUrl(m.painting)}" alt="" data-full="${imgUrl(m.painting)}">
      <div class="body">
        <div class="downloads">
          <a href="${imgUrl(m.wallpaper_desktop)}" download>Desktop wallpaper</a>
          <a href="${imgUrl(m.wallpaper_phone)}" download>Phone wallpaper</a>
        </div>
        ${m.remembered ? `<p class="label">As remembered</p><p class="text">${esc(m.remembered)}</p>` : ""}
        <p class="label">As dreamed</p><p class="${m.remembered ? "raw" : "text"}">${esc(m.raw)}</p>
        ${meta.caption ? `<p class="label">Caption</p><p class="prompt">${esc(meta.caption)}</p>` : ""}
        <p class="label">Painting${meta.style ? " · " + esc(meta.style.name) + (meta.style.wildcard ? " (wildcard)" : "") : ""}</p><p class="prompt">${esc(m.painting_prompt)}</p>
        <p class="meta" style="margin-top:12px">${esc(m.run)}${meta.opening ? " · opening: “" + esc(meta.opening) + "”" : " · no opening"}
          · candidate ${esc(meta.chosen)} of ${esc(meta.candidates?.length ?? "?")}${meta.gpu_minutes != null ? " · " + esc(meta.gpu_minutes) + " GPU min" : ""}</p>
      </div>
    </article>
    ${state.mornings.length > 1 ? `<p class="today-head" style="margin-top:22px">Earlier mornings</p>
    <div class="past">${state.mornings.filter(x => x !== m).map(x => `
      <article class="card" data-day="${esc(x.day)}" style="cursor:pointer">
        <img class="wall" loading="lazy" src="${imgUrl(x.painting)}" alt="" data-day="${esc(x.day)}">
        <div class="body"><div class="meta" data-day="${esc(x.day)}">${esc(x.meta?.label || "Dream " + (x.meta?.number ?? ""))} · ${esc(fmtDay(x.day))}</div></div>
      </article>`).join("")}</div>` : ""}`;
}

// ---------------------------------------------------------------- daily-run alert
// The morning job runs at 7:41 Central and should be done by 9:00. After 9:00
// Central, if today's dream isn't here (or its run reported a failure), say so
// at the top of every tab. Mornings are dated in UTC, which is the same day as
// Central time from 7:41 until 6 pm.
function checkToday(mornings, runs) {
  const el = document.getElementById("alert");
  const now = new Date();
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric",
    month: "2-digit", day: "2-digit", hour: "2-digit", hour12: false }).formatToParts(now).map(p => [p.type, p.value]));
  const today = `${parts.year}-${parts.month}-${parts.day}`, hour = parseInt(parts.hour, 10);
  const have = mornings.some(m => m.day === today);
  const last = runs.find(r => r.day === today);  // newest first
  let msg = null;
  if (last && last.status === "failed") {
    msg = have ? `<strong>Today's dream is up, but its run reported a problem.</strong>${esc(last.error)}`
               : `<strong>Today's dream failed.</strong>${esc(last.error)}`;
  } else if (!have && hour >= 9) {
    msg = last && last.status === "started"
      ? `<strong>Today's dream is late.</strong>The run started at ${esc(new Date(last.created_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }))} and hasn't finished; Kaggle may be queueing it.`
      : `<strong>Today's dream hasn't arrived.</strong>The 7:41 run didn't report in at all, so it may not have started.`;
  }
  el.innerHTML = msg || "";
  el.hidden = !msg;
}

// ---------------------------------------------------------------- Sky
// Every dream is a star. Its place comes from the meaning of the dream (an
// embedding, squeezed to 2D with UMAP, so similar dreams sit together); its
// colour is the voice it was dreamed in. Groups of nearby stars are the first
// constellations, named by the images (symbols) they share.
const TAG_COLORS = { dream: "#f4ead2", myth: "#f0a65a", tale: "#b9a2f2", saga: "#7fd0c4",
                     poem: "#f28fb0", wisdom: "#9ec9ff", chronicle: "#d9c27a" };
const sky = { dreams: [], cons: [], syms: {}, selected: null, pts: [], edges: [] };

async function loadSky() {
  if (skyMode === "sandbox") await loadSandboxSky().catch(() => (skyMode = "arcadia"));
  const [dreams, cons, links] = await Promise.all([
    apiAll("dreams?select=id,run,kind,tag,prompt,text,remembered,day,sky_x,sky_y,constellation&order=id"),
    api("sky_constellations?select=*&order=id", { headers: { Prefer: "" } }),
    // occurrences of a symbol in a dream, with the symbol's label joined in
    apiAll("symbol_occurrences?select=dream_id,mentions,symbols(label)&dream_id=not.is.null&order=id")
      .then(rows => rows.map(r => ({ dream_id: r.dream_id, symbol: r.symbols.label, mentions: r.mentions }))),
  ]);
  sky.dreams = dreams.filter(d => d.sky_x != null);
  sky.cons = cons;
  sky.syms = {};
  for (const l of links) (sky.syms[l.dream_id] ||= []).push(l);
  sky.edges = constellationLines(sky.dreams);
  renderSky();
}

// Constellation lines: a minimum spanning tree inside each constellation, so
// every star is joined to its group by the shortest possible set of lines.
function constellationLines(dreams) {
  const groups = {};
  dreams.forEach((d, i) => (groups[d.constellation] ||= []).push(i));
  const edges = [];
  for (const idx of Object.values(groups)) {
    const inTree = new Set([idx[0]]);
    while (inTree.size < idx.length) {
      let best = null;
      for (const a of inTree) for (const b of idx) {
        if (inTree.has(b)) continue;
        const dx = dreams[a].sky_x - dreams[b].sky_x, dy = dreams[a].sky_y - dreams[b].sky_y, d2 = dx * dx + dy * dy;
        if (!best || d2 < best[2]) best = [a, b, d2];
      }
      inTree.add(best[1]);
      if (best[2] < 0.012) edges.push(best);  // skip long jumps: they read as noise, not shape
    }
  }
  return edges;
}

// Sandbox Sky: the same sky, but its stars are the world engine's dreams (sandbox_dreams, read-only):
// each one dreamt by a person of Corva, coloured by their house, placed by meaning by the engine's
// publish step. Brighter stars were remembered; a halo marks a dream that was told and talked about.
let skyMode = "arcadia";
try { skyMode = localStorage.getItem("arcadia-sky") || "arcadia"; } catch (_) {}
const sandboxSky = { loaded: false, dreams: [], houses: {}, people: {} };
async function loadSandboxSky() {
  if (sandboxSky.loaded) return;
  const [dreams, houses, people, world] = await Promise.all([
    apiAll("sandbox_dreams?select=*&order=id"), apiAll("sandbox_houses?select=id,name,color&order=id"),
    apiAll("sandbox_people?select=id,name,house_id&order=id"), api("sandbox_world?select=*", { headers: { Prefer: "" } }),
  ]);
  sandboxSky.dreams = dreams.filter(d => d.sky_x != null).map(d => ({ ...d, constellation: null }));
  houses.forEach(h => (sandboxSky.houses[h.id] = h));
  people.forEach(p => (sandboxSky.people[p.id] = p));
  sandboxSky.world = world[0];
  sandboxSky.loaded = true;
}
async function setSkyMode(mode) {
  skyMode = mode;
  try { localStorage.setItem("arcadia-sky", mode); } catch (_) {}
  sky.selected = null;
  if (mode === "sandbox") {
    try { await loadSandboxSky(); } catch (e) { toast("Couldn't load the sandbox: " + e.message); skyMode = "arcadia"; }
  }
  renderSky();
}
function starColor(d) {
  if (skyMode === "sandbox") return sandboxSky.houses[sandboxSky.people[d.dreamer_id]?.house_id]?.color || "#f4ead2";
  return TAG_COLORS[d.tag] || "#fff";
}
function skyDreams() { return skyMode === "sandbox" ? sandboxSky.dreams : sky.dreams; }

function renderSky() {
  const el = document.getElementById("sky");
  const modeChips = `<div class="sky-mode"><button class="chip ${skyMode === "arcadia" ? "on" : ""}" data-skymode="arcadia">Arcadia's dreams</button>
    <button class="chip ${skyMode === "sandbox" ? "on" : ""}" data-skymode="sandbox">Sandbox · the people of Corva</button></div>`;
  if (skyMode === "sandbox") {
    const ds = sandboxSky.dreams, W = sandboxSky.world;
    const hs = Object.values(sandboxSky.houses);
    el.innerHTML = `${modeChips}
      <p class="today-head">${ds.length} dreams of the world engine's sandbox${W ? ` · ${esc(W.season)}, year ${W.year}` : ""}</p>
      <div class="sky-wrap"><canvas id="skyCanvas" aria-label="A star map of the sandbox's dreams"></canvas></div>
      <div class="sky-legend">${hs.map(h => `<span><i style="background:${esc(h.color)}"></i>${esc(h.name)}</span>`).join("")}
        <span style="margin-left:auto">bright: remembered · halo: talked about</span></div>
      <div id="starCard"></div>`;
  } else {
  if (!sky.dreams.length) { el.innerHTML = `${modeChips}<p class="empty">The sky is empty. Dreams arrive after the memory sync.</p>`; return; }
  const tags = [...new Set(sky.dreams.map(d => d.tag))];
  el.innerHTML = `${modeChips}
    <p class="today-head">${sky.dreams.length} dreams · ${sky.cons.length} constellations</p>
    <div class="sky-wrap"><canvas id="skyCanvas" aria-label="A star map of every dream"></canvas></div>
    <div class="sky-legend">${tags.map(t => `<span><i style="background:${TAG_COLORS[t] || "#fff"}"></i>${esc(t)}</span>`).join("")}
      <span style="margin-left:auto">tap a star</span></div>
    <div id="starCard"></div>`;
  }
  el.querySelectorAll("[data-skymode]").forEach(b => b.addEventListener("click", () => setSkyMode(b.dataset.skymode)));
  const canvas = document.getElementById("skyCanvas");
  canvas.addEventListener("click", e => {
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null;
    for (const p of sky.pts) { const d = Math.hypot(p.x - x, p.y - y); if (d < 22 && (!best || d < best.d)) best = { d, i: p.i }; }
    if (best) (skyMode === "sandbox" ? selectSandboxStar : selectStar)(skyDreams()[best.i].id);
  });
  drawSky();
}

function drawSky(t = performance.now()) {
  const canvas = document.getElementById("skyCanvas");
  if (!canvas || document.getElementById("sky").hidden) return;  // stop when the tab is closed
  const dpr = Math.min(devicePixelRatio || 1, 2), w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = g.createRadialGradient(w * 0.5, h * 1.1, 0, w * 0.5, h * 0.6, h);
  bg.addColorStop(0, "#1a1f3d"); bg.addColorStop(1, "#060814");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  const P = d => ({ x: 14 + d.sky_x * (w - 28), y: 14 + (1 - d.sky_y) * (h - 28) });
  if (skyMode === "sandbox") { drawSandboxStars(g, P, t); requestAnimationFrame(drawSky); return; }
  sky.pts = sky.dreams.map((d, i) => ({ ...P(d), i }));
  // constellation lines
  g.lineWidth = 0.7;
  for (const [a, b] of sky.edges) {
    const sel = sky.selected && sky.dreams[a].constellation === sky.selected.constellation;
    g.strokeStyle = sel ? "rgba(244,234,210,.38)" : "rgba(180,190,230,.13)";
    g.beginPath(); g.moveTo(sky.pts[a].x, sky.pts[a].y); g.lineTo(sky.pts[b].x, sky.pts[b].y); g.stroke();
  }
  // stars: brighter for more symbols, a halo for mornings, a slow twinkle
  sky.dreams.forEach((d, i) => {
    const p = sky.pts[i], n = (sky.syms[d.id] || []).length;
    const r = 1.4 + Math.min(n, 12) * 0.22 + (d.kind === "morning" ? 1.4 : 0);
    const tw = 0.75 + 0.25 * Math.sin(t / 900 + i * 1.7);
    g.globalAlpha = tw;
    if (d.kind === "morning" || (sky.selected && sky.selected.id === d.id)) {
      const halo = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 6);
      halo.addColorStop(0, "rgba(255,240,200,.45)"); halo.addColorStop(1, "rgba(255,240,200,0)");
      g.fillStyle = halo; g.beginPath(); g.arc(p.x, p.y, r * 6, 0, 7); g.fill();
    }
    g.fillStyle = TAG_COLORS[d.tag] || "#fff";
    g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
    g.globalAlpha = 1;
  });
  // Names sit above their constellation, kept inside the canvas and nudged apart so they never overlap.
  g.font = "600 10px Georgia, serif"; g.textAlign = "center";
  const placed = [];
  for (const c of [...sky.cons].sort((a, b) => b.y - a.y)) {
    const text = c.label.toUpperCase().split("").join(" "), tw = g.measureText(text).width;
    const x = Math.min(Math.max(14 + c.x * (w - 28), tw / 2 + 8), w - tw / 2 - 8);
    let y = Math.min(Math.max(14 + (1 - c.y) * (h - 28) - 16, 14), h - 8);
    for (let tries = 0; tries < 12 && placed.some(r => Math.abs(r.x - x) < (r.w + tw) / 2 + 6 && Math.abs(r.y - y) < 14); tries++)
      y += 14;
    placed.push({ x, y, w: tw });
    g.fillStyle = sky.selected && sky.selected.constellation === c.id ? "rgba(244,234,210,.95)" : "rgba(200,205,235,.6)";
    g.fillText(text, x, y);
  }
  requestAnimationFrame(drawSky);
}

async function selectStar(id) {

  sky.selected = d;

function drawSandboxStars(g, P, t) {
  const ds = sandboxSky.dreams;
  sky.pts = ds.map((d, i) => ({ ...P(d), i }));
  ds.forEach((d, i) => {
    const p = sky.pts[i];
    const r = d.recalled ? 2.2 + Math.min(d.discussed, 6) * 0.45 : 1.2;
    g.globalAlpha = (d.recalled ? 0.85 : 0.45) * (0.8 + 0.2 * Math.sin(t / 900 + i * 1.7));
    if (d.discussed > 0 || (sky.selected && sky.selected.id === d.id)) {
      const halo = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 6);
      halo.addColorStop(0, "rgba(255,240,200,.4)"); halo.addColorStop(1, "rgba(255,240,200,0)");
      g.fillStyle = halo; g.beginPath(); g.arc(p.x, p.y, r * 6, 0, 7); g.fill();
    }
    g.fillStyle = starColor(d);
    g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
  });
  g.globalAlpha = 1;
}
function selectSandboxStar(id) {

      <p class="${d.retelling ? "raw" : "text"}">${esc(d.text)}</p>

// ---------------------------------------------------------------- Chronicle (sandbox)
// The world engine's sandbox, as it stands after its latest season: the chronicle it wrote, who
// believes what about the Flight, how the houses feel about each other, and their clients.
// Read-only (sandbox_* tables); the engine is the only writer.
const FLIGHT_READINGS = [
  ["force", "Carried off", /carried|against her will|took her|stole|abduct/i],
  ["willing", "Her own will", /own will|chose|willing|love/i],
  ["plot", "A Theren plot", /arrang|plot|humiliat|conspir/i],
  ["east", "Sailed east", /east/i],
  ["north", "Northern road", /northern road|north/i],
];
function readingOf(text) { for (const [k, , re] of FLIGHT_READINGS) if (re.test(text)) return k; return "other"; }
function mdToHtml(md) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  const out = []; let list = false;
  for (const line of md.split("\n")) {
    if (/^\s*[-*] /.test(line)) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`); continue; }
    if (list) { out.push("</ul>"); list = false; }
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
    else if (line.startsWith(">")) out.push(`<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("\n");
}
async function loadChronicle() {
  const el = document.getElementById("chronicle");
  const q = p => apiAll(p);
  const [world, houses, people, events, beliefs, feelings, clients, chron, previews] = await Promise.all([
    api("sandbox_world?select=*", { headers: { Prefer: "" } }), q("sandbox_houses?select=*&order=id"), q("sandbox_people?select=*&order=id"),
    q("sandbox_events?select=id,kind,year,season&order=id"), q("sandbox_beliefs?select=holder_id,subject_type,subject_id,interpretation,confidence&subject_type=eq.event&order=id"),
    q("sandbox_house_feelings?select=*&order=from_house"), q("sandbox_house_clients?select=*&order=id"),
    q("sandbox_chronicles?select=*&kind=eq.chronicle&order=id"),
    api("sandbox_previews?select=*&order=id.desc&limit=1", { headers: { Prefer: "" } }).catch(() => []),
  ]);
  const W = world[0];
  if (!W) { el.innerHTML = `<p class="empty">The sandbox hasn't been published yet (python -m world.publish).</p>`; return; }
  const H = Object.fromEntries(houses.map(h => [h.id, h]));
  const dot = h => `<span class="dot" style="background:${esc(h?.color)}"></span>`;
  const latest = chron[chron.length - 1];

  // who believes what about the Flight: each person's strongest reading of "why", and of "where"
  const flight = events.find(e => e.kind === "departure");
  const byPerson = {};
  for (const b of beliefs) if (flight && String(b.subject_id) === String(flight.id)) (byPerson[b.holder_id] ||= []).push(b);
  const cols = [...FLIGHT_READINGS.map(([k, label]) => [k, label]), ["other", "Other"]];
  const rowsHtml = [], details = [];
  for (const h of houses) {
    const members = people.filter(p => p.house_id === h.id && !p.absent);
    const count = Object.fromEntries(cols.map(([k]) => [k, { n: 0, conf: 0 }]));
    const lines = [];
    for (const p of members) {
      const bs = (byPerson[p.id] || []).filter(b => b.confidence >= 0.2).sort((a, b) => b.confidence - a.confidence);
      const seen = new Set();
      for (const b of bs) { const k = readingOf(b.interpretation); if (seen.has(k)) continue; seen.add(k); count[k].n++; count[k].conf += b.confidence; }
      if (bs.length) lines.push(`<p>${esc(p.name)}: ${bs.slice(0, 2).map(b => `“${esc(b.interpretation)}” <small>${Math.round(b.confidence * 100)}%</small>`).join("; ")}</p>`);
    }
    rowsHtml.push(`<tr><td>${dot(h)}${esc(h.name)}</td>${cols.map(([k]) => {
      const c = count[k]; if (!c.n) return `<td style="color:var(--line)">·</td>`;
      const a = 0.15 + 0.6 * (c.conf / c.n);
      return `<td title="average confidence ${Math.round(100 * c.conf / c.n)}%"><span class="cellnum" style="background:rgba(184,134,43,${a.toFixed(2)})">${c.n}</span></td>`;
    }).join("")}</tr>`);
    details.push(`<details class="who-believes"><summary>${dot(h)}House ${esc(h.name)}: each person</summary>${lines.join("") || "<p><small>no one holds a view</small></p>"}</details>`);
  }

  // house to house feelings: rows feel about columns (-1 cold .. +1 warm), from members' beliefs
  const F = {};
  for (const f of feelings) F[f.from_house + ":" + f.to_house] = f;
  const feelCell = f => {
    if (!f) return `<td style="color:var(--line)">·</td>`;
    const v = Math.max(-1, Math.min(1, f.feeling)), c = v < 0 ? `rgba(176,58,46,${(0.25 + 0.75 * -v).toFixed(2)})` : `rgba(63,125,79,${(0.25 + 0.75 * v).toFixed(2)})`;
    return `<td><span class="feel" style="background:${c}" title="${f.beliefs} beliefs">${v > 0 ? "+" : ""}${v.toFixed(1)}</span></td>`;
  };
  const feelRows = houses.map(a => `<tr><td>${dot(a)}${esc(a.name)}</td>${houses.map(b => a.id === b.id ? `<td style="color:var(--line)">–</td>` : feelCell(F[a.id + ":" + b.id])).join("")}</tr>`).join("");

  // clients: the latest count and loyalty per house, and this season's change
  const lastC = {};
  for (const c of clients) if (c.house_id != null) lastC[c.house_id] = c;
  const clientRows = houses.map(h => { const c = lastC[h.id]; if (!c) return "";
    return `<tr><td>${dot(h)}${esc(h.name)}</td><td>${c.count}</td><td><span class="bar-mini"><b style="width:${Math.round((c.loyalty || 0) * 100)}%"></b></span> ${Math.round((c.loyalty || 0) * 100)}%</td>
            <td style="color:var(--keep)">${c.gained ? "+" + c.gained : ""}</td><td style="color:var(--skip)">${c.lost ? "−" + c.lost : ""}</td></tr>`; }).join("");

  const pv = previews[0];
  el.innerHTML = `
    <p class="today-head">World engine sandbox · ${esc(W.season)}, year ${W.year} · season ${W.tick}</p>
    <p class="sandbox-note">Offline sandbox, not production. Published ${new Date(W.published_at).toLocaleString()}.
      <a href="/world/?world=sandbox">See it on the island ↗</a></p>
    ${pv ? `<article class="card"><img class="wall" src="${pv.image ? STORAGE + esc(pv.image) : ""}" alt="" data-view="${pv.image ? STORAGE + esc(pv.image) : ""}">
      <div class="body"><div class="meta">Wallpaper preview (not production): tomorrow's wallpaper if it came from the engine's most-discussed dream</div>
      <p class="text" style="margin-top:4px">A dream of ${esc(pv.dreamer)}, House ${esc(pv.house)} · Arcadia, ${esc(pv.season)} of year ${pv.year}</p>
      ${pv.status !== "done" ? `<p class="meta">${esc(pv.status)}${pv.error ? ": " + esc(pv.error) : ""}</p>` : ""}</div></article>` : ""}
    <article class="card"><div class="body"><div class="chron clamped" id="chronText">${latest ? mdToHtml(latest.text) : "<p class='empty'>No chronicle yet.</p>"}</div>
      <button class="more" id="chronMore">Read the whole chronicle</button></div></article>
    <article class="card"><div class="body"><p class="label" style="margin-top:0">Who believes what about the Flight</p>
      <p class="meta">People in each house holding each reading (confidence ≥ 20%; one person can hold a “why” and a “where”). Darker: held more firmly.</p>
      <div class="tbl-wrap"><table class="grid"><thead><tr><th>House</th>${cols.map(([, l]) => `<th>${esc(l)}</th>`).join("")}</tr></thead><tbody>${rowsHtml.join("")}</tbody></table></div>
      ${details.join("")}</div></article>
    <article class="card"><div class="body"><p class="label" style="margin-top:0">How the houses feel about each other</p>
      <p class="meta">Each row's feeling about each column, from its members' beliefs about past events (−1 cold … +1 warm).</p>
      <div class="tbl-wrap"><table class="grid"><thead><tr><th>feels →</th>${houses.map(h => `<th title="${esc(h.name)}">${esc(h.name.slice(0, 4))}</th>`).join("")}</tr></thead><tbody>${feelRows}</tbody></table></div></div></article>
    <article class="card"><div class="body"><p class="label" style="margin-top:0">Clients and loyalty</p>
      <div class="tbl-wrap"><table class="grid"><thead><tr><th>House</th><th>Clients</th><th>Loyalty</th><th>Gained</th><th>Lost</th></tr></thead><tbody>${clientRows}</tbody></table></div></div></article>`;
  document.getElementById("chronMore")?.addEventListener("click", e => { document.getElementById("chronText").classList.remove("clamped"); e.target.remove(); });
  el.querySelector("[data-view]")?.addEventListener("click", e => e.target.dataset.view && openViewer(e.target.dataset.view));
}

async function pick(id) {

  renderCorva();
  try {
    await api("images?kind=eq.corva&picked=is.true", { method: "PATCH", body: JSON.stringify({ picked: false }) });

// ---------------------------------------------------------------- Dreams
function dreamLabel(d) {
  const m = d.id.match(/^(run\d+)-read-(\d+)$/);
  if (m) return `${m[1]} · read test #${parseInt(m[2], 10)}`;
  const p = d.id.match(/^(run\d+)-priming-(.+)$/);
  return p ? `${p[1]} · priming ${p[2]}` : d.id;
}

function renderDreams() {
  const el = document.getElementById("dreams");
  if (!state.dreams.length) { el.innerHTML = `<p class="empty">No dreams yet.</p>`; return; }
  // Newest run first; the run chips switch between runs (default: the newest).
  const runs = [...new Set(state.dreams.map(d => d.run))].sort((a, b) => parseInt(b.slice(3)) - parseInt(a.slice(3)));
  if (!state.run) state.run = runs[0];
  const all = state.run === "all" ? state.dreams : state.dreams.filter(d => d.run === state.run);
  const keeps = all.filter(d => d.mark === "keep").length, skips = all.filter(d => d.mark === "skip").length;
  const shown = all.filter(d => state.filter === "all" || (state.filter === "unmarked" ? !d.mark : d.mark === state.filter));
  const paintings = Object.fromEntries(state.images.filter(i => i.kind === "dream" && i.dream_id).map(i => [i.dream_id, i.id]));
  el.innerHTML = `
    <div class="tally"><span><strong>${keeps}</strong> kept of ${all.length}</span><span class="meta">${skips} skipped · ${all.length - keeps - skips} unmarked</span></div>
    <div class="filters">${[...runs, "all"].map(r => `<button class="chip ${state.run === r ? "on" : ""}" data-run="${r}">${r === "all" ? "All runs" : r.replace("run", "Run ")}</button>`).join("")}</div>
    <div class="filters">${["all", "unmarked", "keep", "skip"].map(f => `<button class="chip ${state.filter === f ? "on" : ""}" data-filter="${f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join("")}</div>
    ${shown.length ? "" : `<p class="empty">Nothing here.</p>`}` +
    shown.map(d => {
      const image = d.image || paintings[d.id];
      const long = d.text.length > 650;
      return `
      <article class="card" data-id="${esc(d.id)}">
        ${image ? `<img loading="lazy" src="${imgUrl(image)}" alt="" data-full="${imgUrl(image)}">` : ""}
        <div class="body">
          <div class="meta">${esc(dreamLabel(d))}</div>
          ${d.prompt ? `<p class="prompt">Opening: “${esc(d.prompt)}”</p>` : ""}
          <p class="text ${long ? "clamped" : ""}">${esc(d.text)}</p>
          ${long ? `<button class="more" data-more>Show all</button>` : ""}
          <div class="row">
            <button class="btn keep ${d.mark === "keep" ? "on" : ""}" data-mark="keep">Keep</button>
            <button class="btn skip ${d.mark === "skip" ? "on" : ""}" data-mark="skip">Skip</button>
          </div>
          <textarea rows="1" placeholder="Note (optional)" data-note>${esc(d.note || "")}</textarea>
          <div class="saved" data-saved></div>
        </div>
      </article>`;
    }).join("");
}

async function mark(id, value) {
  const d = state.dreams.find(x => x.id === id);
  const old = d.mark;
  d.mark = d.mark === value ? null : value;  // tapping the active button again clears it
  renderDreams();
  try { await api(`review_dreams?id=eq.${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify({ mark: d.mark }) }); }
  catch (e) { d.mark = old; renderDreams(); toast("Couldn't save: " + e.message); }
}

async function saveNote(id, value, statusEl) {
  const d = state.dreams.find(x => x.id === id);
  if ((d.note || "") === value) return;
  try {
    await api(`review_dreams?id=eq.${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify({ note: value || null }) });
    d.note = value; if (statusEl) { statusEl.textContent = "Note saved"; setTimeout(() => (statusEl.textContent = ""), 2000); }
  } catch (e) { toast("Couldn't save the note: " + e.message); }
}

// ---------------------------------------------------------------- Wallpapers
function renderWallpapers() {
  const el = document.getElementById("wallpapers");
  const items = state.images.filter(i => i.kind === "wallpaper");
  el.innerHTML = items.length ? items.map(i => `
      <article class="card">
        <img class="wall" loading="lazy" src="${imgUrl(i.id)}" alt="" data-full="${imgUrl(i.id)}">
        <div class="body"><div class="meta">${esc(i.id.split("/").pop())}${i.meta?.source ? " · " + esc(i.meta.source) : ""}</div></div>
      </article>`).join("") : `<p class="empty">No wallpapers yet.</p>`;
}

// ---------------------------------------------------------------- events
document.querySelector("main").addEventListener("click", e => {
  const t = e.target;
  const star = t.closest("[data-star]");
  if (star) return selectStar(star.dataset.star);
  if (t.dataset.day) { state.day = t.dataset.day; renderToday(); return window.scrollTo(0, 0); }
  if (t.dataset.full) return openViewer(t.dataset.full);
  if (t.dataset.pick) return pick(t.dataset.pick);
  if (t.dataset.filter) { state.filter = t.dataset.filter; return renderDreams(); }
  if (t.dataset.run) { state.run = t.dataset.run; return renderDreams(); }
  const card = t.closest("[data-id]");
  if (t.dataset.mark && card) return mark(card.dataset.id, t.dataset.mark);
  if (t.hasAttribute("data-more")) { t.previousElementSibling.classList.remove("clamped"); t.remove(); }
});
document.querySelector("main").addEventListener("focusout", e => {
  if (e.target.hasAttribute("data-note")) {
    const card = e.target.closest("[data-id]");
    saveNote(card.dataset.id, e.target.value.trim(), card.querySelector("[data-saved]"));
  }
});

// ---------------------------------------------------------------- load
(async () => {
  // Mornings load on their own, so a problem there never hides the review tabs (and vice versa).
  loadChronicle().catch(e => { document.getElementById("chronicle").innerHTML = `<p class="empty">Couldn't load the sandbox: ${esc(e.message)}</p>`; });
  loadSky().catch(e => { document.getElementById("sky").innerHTML = `<p class="empty">Couldn't load: ${esc(e.message)}</p>`; });
  Promise.all([
    api("mornings?select=*&order=day.desc", { headers: { Prefer: "" } }),
    api("morning_runs?select=day,status,error,created_at&order=created_at.desc&limit=20", { headers: { Prefer: "" } })
      .catch(() => []),
  ])
    .then(([rows, runs]) => { state.mornings = rows; renderToday(); checkToday(rows, runs); })
    .catch(e => { document.getElementById("today").innerHTML = `<p class="empty">Couldn't load: ${esc(e.message)}</p>`; });
  try {
    [state.images, state.dreams] = await Promise.all([
      api("images?select=id,kind,prompt,seed,meta,dream_id,picked&order=id", { headers: { Prefer: "" } }),
      api("review_dreams?select=*&order=id", { headers: { Prefer: "" } }),
    ]);
    renderCorva(); renderDreams(); renderWallpapers();
  } catch (e) {
    document.querySelectorAll("main section:not(#today)").forEach(s => (s.innerHTML = `<p class="empty">Couldn't load: ${esc(e.message)}</p>`));
  }
})();
</script>
</body>
</html>
