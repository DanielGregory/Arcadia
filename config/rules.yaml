# World engine v0: every rule parameter in one place. Simple defaults, all PROPOSED; change freely.
# Read by world/rules.py. Probabilities are 0..1; "per season" means per tick.

time:
  start_year: 0               # the Flight happened in the autumn of year 0; the first tick is that winter
  first_season: winter
  seasons: [spring, summer, autumn, winter]

population:                   # targets for genesis
  principals: 25              # full agents: dream, interpret, act through the storyteller
  side_characters: 75         # named, in houses: age, marry, die, dream; act by simple rules
  townsfolk: 200              # counts only
  unattached_share: 0.18      # townsfolk who are nobody's clients
  adult_age: 16               # younger people cannot act in proposals

dreaming:
  model: checkpoints/run5/best.pt
  max_tokens: 140
  settings: {temperature: 0.9, top_p: 0.9, repetition_penalty: 1.1}
  # the voice (source tag) each temperament dreams in; random_tag_chance of the time, any voice
  tag:
    mystic: dream
    romantic: poem
    traditionalist: myth
    sage: wisdom
    pragmatist: chronicle
    skeptic: tale
  random_tag_chance: 0.2
  opening_chance: 0.6         # dreams that start from an image in the dreamer's own memories
  # chance of remembering a dream on waking, before vividness and recency
  recall:
    mystic: 0.85
    romantic: 0.55
    traditionalist: 0.45
    sage: 0.4
    pragmatist: 0.25
    skeptic: 0.12
  vividness_weight: 0.5       # recall chance x (1 - w + w x vividness)
  # a remembered dream is told to someone with this chance (+ warmth bonus); mystics nearly always tell
  share_base: 0.25
  share_warmth: 0.4
  share_mystic_bonus: 0.4
  rumor_dreams: 2             # townsfolk "rumor dreams" of unknown origin per season

interpretation:
  model: Qwen/Qwen2.5-1.5B-Instruct
  max_per_season: 8           # shared dreams interpreted (the most salient first)
  max_new_tokens: 220
  listener_trust: 0.7         # a listener takes the teller's reading at confidence x trust x (0.5 + warmth/2)

storyteller:
  model: Qwen/Qwen2.5-3B-Instruct  # the storyteller and the chronicle's accounts (interpretations keep the 1.5B)
  max_new_tokens: 320
  dtype: bfloat16             # 3B in float32 needs ~12 GB and was killed for memory; bfloat16 halves it (the CPU has native bf16)
  retries: 1                  # if a reply is unusable (or names nobody), ask once more, saying what was wrong
  proposals_per_house: 2      # one call per house per season, asking for up to this many actions
  legends_in_context: 2       # legends the house's members know, retrieved into the prompt

validation:
  # Proposals whose text asserts what something MEANS are rejected (the hard rule).
  meaning_patterns: ["\\bmeans?\\b", "\\bomen\\b", "\\bportent", "\\bsign (that|of|from)\\b", "\\bthe gods (want|will|demand|wish|sent|send)",
                     "\\bfate\\b", "\\bdestin", "\\bprophec", "\\bcursed?\\b", "\\bblessed by\\b"]
  one_action_per_actor: true
  strangeness_per_year: 2     # rare natural events the storyteller may propose
  # Kinds of action. The storyteller may name any action ("bribe the harbour master", "spread a rumour");
  # the engine sorts it into one of these families by keywords, then resolves it with the family's base
  # chance of success, chance of a partial result, and cost. Anything matching no family is resolved as
  # "other" (a plain attempt, no special effects).
  kinds:
    search:      {base: 0.5, partial: 0.3, cost: {food: 2}, words: [search, seek, scour, look for, hunt for, track]}
    investigate: {base: 0.45, partial: 0.3, words: [investigat, question, interrogat, inquir, spy, watch, follow, ask]}
    accuse:      {base: 0.7, partial: 0.2, words: [accus, denounc, blame, charge]}
    threaten:    {base: 0.6, partial: 0.25, words: [threat, intimidat, warn, menac]}
    demand:      {base: 0.6, partial: 0.3, words: [demand, insist, ultimatum, claim]}
    rumor:       {base: 0.6, partial: 0.25, words: [rumor, rumour, gossip, slander, whisper, spread]}
    bribe:       {base: 0.5, partial: 0.25, cost: {goods: 3}, words: [bribe, pay off, buy off, payment]}
    petition:    {base: 0.55, partial: 0.3, words: [petition, appeal, plead, council]}
    judge:       {base: 0.6, partial: 0.3, words: [judg, arbitrat, rule on, settle]}
    rite:        {base: 0.75, partial: 0.2, cost: {goods: 1}, words: [pray, rite, sacrific, offering, ritual, ceremon, bless]}
    feast:       {base: 0.8, partial: 0.15, cost: {food: 4}, words: [feast, banquet, celebrat, festival, dinner]}
    gift:        {base: 0.75, partial: 0.15, cost: {goods: 2}, words: [gift, give, donat, present]}
    marriage:    {base: 0.4, partial: 0.3, words: [marri, marry, betroth, wed]}
    alliance:    {base: 0.4, partial: 0.3, words: [allian, ally, pact, oath, swear, treaty]}
    trade:       {base: 0.65, partial: 0.25, cost: {goods: 1}, words: [trade, sell, merchant, venture, cargo]}
    guard:       {base: 0.75, partial: 0.2, words: [guard, patrol, fortif, protect, defend, secure]}
    build:       {base: 0.6, partial: 0.3, cost: {materials: 3}, words: [build, repair, construct, rebuild]}
    work_land:   {base: 0.7, partial: 0.25, words: [work, harvest, tend, herd, farm, fish, quarr, plant]}
    insult:      {base: 0.8, partial: 0.1, words: [insult, slight, mock, shame, humiliat]}
    flee:        {base: 0.55, partial: 0.2, words: [flee, escape, leave corva, exile]}
    confess:     {base: 0.7, partial: 0.2, words: [confess, admit, reveal, tell the truth]}
    withdraw:    {base: 0.9, partial: 0.05, words: [withdraw, wait, mourn, hide, retreat, stay]}
    other:       {base: 0.5, partial: 0.3, words: []}
  repeat_penalty: 0.6         # each earlier use of the same family this season multiplies the chance by this
  # the season makes some kinds harder (multiplies the base chance)
  season_factor:
    winter: {search: 0.7, trade: 0.6, build: 0.7, work_land: 0.6, flee: 0.7}
    spring: {work_land: 1.1}
    summer: {trade: 1.1, build: 1.1}
    autumn: {work_land: 1.2}
  trait_weight: 0.3           # the actor's relevant trait moves the chance by up to +/- this
  search_find_chance: 0.12    # searching the right place turns up a trace with this chance (sealed: never reported)

beliefs:
  witness_confidence: 0.65    # actors and targets
  hearsay_confidence: 0.35    # other members of the houses involved
  fade_per_season: 0.97       # inter-house beliefs fade slowly...
  reopen_boost: 0.2           # ...and come back when a new event touches the same two houses
  inherit_factor: 0.6         # children hold their parents' inter-house beliefs at this fraction
  # how strongly each kind of event moves the houses' stances toward each other (target house's
  # members toward the actor's house, and the actor's toward the target's)
  stance:
    demand:   {target_to_actor: -0.4, actor_to_target: -0.3}
    accuse:   {target_to_actor: -0.6, actor_to_target: -0.5}
    insult:   {target_to_actor: -0.7, actor_to_target: -0.3}
    gift:     {target_to_actor: 0.4,  actor_to_target: 0.2}
    alliance: {target_to_actor: 0.5,  actor_to_target: 0.5}
    judge:    {target_to_actor: -0.2, actor_to_target: 0.0}
    investigate: {target_to_actor: -0.3, actor_to_target: -0.1}
    threaten: {target_to_actor: -0.6, actor_to_target: -0.4}
    rumor:    {target_to_actor: -0.4, actor_to_target: -0.2}
    bribe:    {target_to_actor: 0.2,  actor_to_target: 0.0}
    marriage: {target_to_actor: 0.3,  actor_to_target: 0.2}

houses:
  # what a house's land yields per season (food, goods, materials), times a season factor
  yield:
    city:     {food: 2, goods: 3, materials: 1}
    ships:    {food: 2, goods: 4, materials: 0}
    groves:   {food: 6, goods: 2, materials: 0}
    temple:   {food: 2, goods: 2, materials: 0}
    trade:    {food: 3, goods: 5, materials: 0}
    quarries: {food: 1, goods: 2, materials: 5}
    law:      {food: 2, goods: 2, materials: 0}
    healing:  {food: 2, goods: 1, materials: 0}
    herds:    {food: 5, goods: 1, materials: 1}
    faded:    {food: 1, goods: 1, materials: 0}
  season_yield: {spring: 0.8, summer: 1.0, autumn: 1.4, winter: 0.5}
  member_food: 0.1            # food a named member eats per season

clients:
  food_per_client: 0.08       # a house feeds its clients this much each per season
  loyalty_fed: 0.03           # loyalty change when the house could feed them
  loyalty_hungry: -0.08       # ...and when it could not
  feast_loyalty: 0.08
  rite_loyalty: 0.05          # the temple's clients, after a rite
  scandal_loyalty: -0.06      # a house accused or shamed in public
  defect_below: 0.35          # below this loyalty, some clients leave
  defect_rate: 0.2            # share of clients who leave when they do
  join_from_unattached: 0.06  # a feast or rite draws in this share of the unattached
